name: hermes-private
version: 0.2.0
description: "Privacy-first Hermes profile: fail-closed web search, Hindsight memory, reviewed skills"
hermes_requires: ">=0.21.0"
author: "JDsnyke"
license: "MIT"
env_requires:
  - name: HINDSIGHT_API_URL
    description: "Private/local Hindsight endpoint"
    required: false
    default: "http://127.0.0.1:8888"
  - name: SEARXNG_URL
    description: "Private/local SearXNG endpoint"
    required: false
    default: "http://127.0.0.1:8088"
