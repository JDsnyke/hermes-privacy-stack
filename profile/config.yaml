memory:
  # Keep Hermes' built-in local MEMORY.md / USER.md capability available, but do
  # not bind the distribution to a commercial/open-core external provider.
  write_approval: true

skills:
  write_approval: true
  guard_agent_created: true

web:
  search_backend: searxng
  keyless_fallback: false
  keyless_rescue: false

# Shared semantic memory is attached as the self-hosted mcp-memory-service MCP
# during bootstrap. Model credentials are intentionally never shipped here.
# The installer supports either:
#   1) a local llama.cpp OpenAI-compatible endpoint, or
#   2) optional OpenAI Codex / ChatGPT OAuth through `hermes model`.
