name: hermes-privacy-stack

# Strict-free runtime: every service below is self-hosted and usable without a
# paid feature tier or license key. Runtime secrets/config are generated outside Git.
# Compatible with Docker Compose and Podman Compose.

services:
  memory:
    profiles: ["core"]
    image: ${HPS_MEMORY_IMAGE:-ghcr.io/doobidoo/mcp-memory-service:latest}
    restart: unless-stopped
    environment:
      MCP_MODE: streamable-http
      MCP_STREAMABLE_HTTP_MODE: "1"
      MCP_SSE_HOST: 0.0.0.0
      MCP_SSE_PORT: "8765"
      MCP_API_KEY: ${HPS_MEMORY_API_KEY:?Run bootstrap.py first}
      MCP_MEMORY_STORAGE_BACKEND: sqlite_vec
      MCP_MEMORY_SQLITE_PATH: /app/data/sqlite_vec.db
      MCP_MEMORY_BACKUPS_PATH: /app/data/backups
      MCP_ALLOW_ANONYMOUS_ACCESS: "false"
      LOG_LEVEL: INFO
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    volumes:
      - memory_data:/app/data
    networks: [private]

  searxng:
    profiles: ["core"]
    image: ${HPS_SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:8088:8080"
    volumes:
      - "${HPS_SEARXNG_CONFIG_DIR:-./config/searxng}:/etc/searxng:ro"
      - searxng_data:/var/cache/searxng
    networks: [private]

  docling:
    profiles: ["core"]
    image: ${HPS_DOCLING_IMAGE:-quay.io/docling-project/docling-serve:latest}
    restart: unless-stopped
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:5001:5001"
    networks: [private]

  llama-cpp:
    profiles: ["local-model"]
    image: ${HPS_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    command:
      - -m
      - /models/${HPS_LLAMA_MODEL_FILE:?Choose a local GGUF model during setup}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "65536"
      - --n-gpu-layers
      - ${HPS_LLAMA_GPU_LAYERS:-0}
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - "${HPS_LLAMA_MODEL_DIR:?Choose a local GGUF model during setup}:/models:ro"
    networks: [private]

  crawl4ai:
    profiles: ["research"]
    image: ${HPS_CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.8.6}
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:11235:11235"
    networks: [private]

  node-red:
    profiles: ["automation"]
    image: ${HPS_NODERED_IMAGE:-nodered/node-red:4.1.10}
    restart: unless-stopped
    environment:
      NODE_RED_CREDENTIAL_SECRET: ${HPS_NODERED_CREDENTIAL_SECRET:?Run bootstrap.py first}
      NODE_RED_ENABLE_PROJECTS: "true"
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:1880:1880"
    volumes:
      - node_red_data:/data
    networks: [private]

  forgejo:
    profiles: ["git"]
    image: ${HPS_FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15.0.8}
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "${HPS_BIND_ADDRESS:-127.0.0.1}:2222:22"
    volumes:
      - forgejo_data:/data
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  memory_data:
  searxng_data:
  node_red_data:
  forgejo_data:
