name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret hygiene
        run: python scripts/check_secrets.py
      - name: Python syntax
        run: python -m compileall -q bootstrap.py scripts
      - name: Shell syntax
        run: bash -n install.sh
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('ok', p)
          PY
      - name: Validate YAML parse
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          for p in [pathlib.Path('profile/distribution.yaml'), pathlib.Path('profile/config.yaml'), pathlib.Path('stack/compose.yml'), pathlib.Path('stack/config/searxng/settings.yml')]:
              yaml.safe_load(p.read_text())
              print('ok', p)
          PY
      - name: Verify static site files
        run: test -s site/index.html && test -s site/styles.css && test -s site/app.js
