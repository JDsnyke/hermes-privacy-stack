name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Bootstrap self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q bootstrap.py scripts
      - name: Bootstrap privacy invariants
        run: python bootstrap.py --self-test
      - name: Private-network invariants
        run: python scripts/private_network.py --self-test
      - name: Image-lock parser invariants
        run: python scripts/image_lock.py --self-test
      - name: Nango setup invariants
        run: python scripts/setup_nango.py --self-test
      - name: Nango proxy authority invariants
        run: python scripts/nango_proxy.py --self-test
      - name: Hindsight profile-bank configuration
        run: python scripts/test_hindsight_config.py
      - name: Bootstrap twice-run idempotency
        run: python scripts/test_bootstrap_idempotency.py
      - name: Profile bundle discovery
        run: python scripts/install_profiles.py --list
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Secret hygiene
        run: python scripts/check_secrets.py
      - name: Shell syntax
        run: bash -n install.sh
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('ok', p)
          PY
      - name: Validate YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          for pattern in ('*.yml', '*.yaml'):
              for p in pathlib.Path('.').rglob(pattern):
                  yaml.safe_load(p.read_text())
                  print('ok', p)
          PY
      - name: Validate profile SOUL bundles
        run: |
          python - <<'PY'
          import pathlib
          required = {'private-personal', 'coder', 'researcher', 'operator'}
          root = pathlib.Path('templates/profiles')
          found = {p.parent.name for p in root.glob('*/SOUL.md') if p.stat().st_size > 100}
          missing = required - found
          if missing:
              raise SystemExit('missing/empty SOUL bundles: ' + ', '.join(sorted(missing)))
          print('profile bundles ok:', ', '.join(sorted(found)))
          PY
      - name: Personality builder deterministic output
        run: |
          tmp="$(mktemp)"
          python scripts/build_personality.py \
            --tone direct \
            --verbosity low \
            --initiative balanced \
            --confirmation strict \
            --memory minimal \
            --output "$tmp" \
            --apply \
            --yes
          grep -q '^# Soul — Custom Private Hermes' "$tmp"
          grep -q 'Never place passwords' "$tmp"
          grep -q 'Confirm before external writes' "$tmp"
          rm -f "$tmp"
      - name: Compose core structure
        run: docker compose -f stack/compose.yml --profile core config --quiet
      - name: Compose Nango structure
        env:
          HPS_NANGO_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          HPS_NANGO_DB_PASSWORD: ci-placeholder
          HPS_NANGO_DASHBOARD_PASSWORD: ci-placeholder
        run: docker compose -f stack/compose.yml --profile nango config --quiet
      - name: Verify SearXNG runtime secret marker
        run: grep -q '__HPS_SEARXNG_SECRET__' stack/config/searxng/settings.yml
      - name: Verify static site files and local-only dependencies
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          ! grep -Eri '<script[^>]+src="https?://|<link[^>]+href="https?://|google-analytics|gtag\(' site
