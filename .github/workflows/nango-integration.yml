name: Nango integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'stack/compose.yml'
      - 'scripts/setup_nango.py'
      - 'scripts/nango_proxy.py'
      - 'skills/nango-proxy/**'
      - '.github/workflows/nango-integration.yml'

permissions:
  contents: read

concurrency:
  group: nango-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-proxy-self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_PRIVACY_STACK_STATE: ${{ runner.temp }}/hps-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Generate disposable Nango runtime secrets
        run: python scripts/setup_nango.py --no-start --no-install-skill

      - name: Validate rendered Nango Compose profile
        run: |
          docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            config --quiet

      - name: Start Nango Free Self-Hosted
        run: |
          docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            up -d nango-db nango

      - name: Wait for Nango health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3003/health | grep -q '"result":"ok"'; then
              echo 'Nango API is healthy'
              exit 0
            fi
            sleep 3
          done
          echo 'Nango API did not become healthy in time' >&2
          docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            logs --no-color nango-db nango || true
          exit 1

      - name: Verify Connect UI and private database exposure
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:3009/ >/dev/null

          db_port="$(docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            port nango-db 5432 2>/dev/null || true)"
          if [[ -n "$db_port" ]]; then
            echo "Nango Postgres unexpectedly published to host: $db_port" >&2
            exit 1
          fi

          api_port="$(docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            port nango 3003)"
          case "$api_port" in
            127.0.0.1:3003) ;;
            *) echo "Nango API is not loopback-bound: $api_port" >&2; exit 1 ;;
          esac

      - name: Verify generated secrets are non-placeholder and stable
        shell: bash
        run: |
          set -euo pipefail
          env_file="$HERMES_PRIVACY_STACK_STATE/stack.env"
          before="$(sha256sum "$env_file" | cut -d' ' -f1)"
          python scripts/setup_nango.py --no-start --no-install-skill >/dev/null
          after="$(sha256sum "$env_file" | cut -d' ' -f1)"
          test "$before" = "$after"
          ! grep -q 'ci-placeholder\|image-lock-not-a-runtime-secret' "$env_file"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            logs --no-color nango-db nango || true

      - name: Tear down disposable Nango stack
        if: always()
        run: |
          docker compose \
            --env-file "$HERMES_PRIVACY_STACK_STATE/stack.env" \
            -f stack/compose.yml \
            --profile nango \
            down -v --remove-orphans || true
