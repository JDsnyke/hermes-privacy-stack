name: Hindsight integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/hindsight_smoke.py'
      - 'stack/compose.yml'
      - '.github/workflows/hindsight-integration.yml'
  pull_request:
    paths:
      - 'scripts/hindsight_smoke.py'
      - 'stack/compose.yml'
      - '.github/workflows/hindsight-integration.yml'

permissions:
  contents: read

concurrency:
  group: hindsight-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retain-recall-reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HPS_BIND_ADDRESS: 127.0.0.1
      HPS_HINDSIGHT_MODEL: qwen3.5:4b
      # Hosted Actions runners are CPU-only and Ollama exposes one inference slot in
      # this topology. Keep the production default true in Compose, but disable
      # automatic observation consolidation for this isolated foreground smoke test
      # so reflect cannot sit behind a newly queued consolidation LLM job.
      HPS_HINDSIGHT_AUTO_CONSOLIDATION: 'false'
      HPS_HINDSIGHT_LLM_MAX_CONCURRENT: '1'
      HINDSIGHT_API_URL: http://127.0.0.1:8888
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate smoke-test syntax
        run: python -m py_compile scripts/hindsight_smoke.py

      - name: Start Ollama
        run: docker compose -f stack/compose.yml --profile core up -d ollama

      - name: Pull auxiliary model
        run: docker compose -f stack/compose.yml --profile core run --rm ollama-init

      - name: Start Hindsight
        run: docker compose -f stack/compose.yml --profile core up -d hindsight

      - name: Wait for Hindsight health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8888/health >/dev/null 2>&1; then
              echo 'Hindsight is healthy'
              exit 0
            fi
            sleep 5
          done
          echo 'Hindsight did not become healthy in time' >&2
          docker compose -f stack/compose.yml --profile core logs hindsight ollama || true
          exit 1

      - name: Retain recall reflect smoke test
        run: python scripts/hindsight_smoke.py --json --timeout 300 --max-tokens 256

      - name: Show logs on failure
        if: failure()
        run: docker compose -f stack/compose.yml --profile core logs --no-color hindsight ollama || true

      - name: Tear down synthetic integration stack
        if: always()
        run: docker compose -f stack/compose.yml --profile core down -v --remove-orphans || true
